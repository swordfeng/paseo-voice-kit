# whisper-rs-sys 0.15.0 from crates.io, vendored by voicekit and wired in server/Cargo.toml with
# [patch.crates-io]. The only change is the `backend-dl` feature (build.rs lines marked
# "[voicekit patch]"): ggml is built in backend-plugin mode (BUILD_SHARED_LIBS, GGML_BACKEND_DL,
# GGML_CPU_ALL_VARIANTS, GGML_NATIVE=OFF), the binary links only libwhisper/libggml/libggml-base,
# and the shared libraries plus backend modules are copied next to the built binaries. Combined
# with `vulkan` it builds the ggml-vulkan module without linking the Vulkan loader into the
# binary. The application loads backends at runtime (ggml_backend_load_all_from_path).
# `git diff` against the commit that vendored this crate shows the whole patch.

[package]
edition = "2021"
rust-version = "1.88.0"
name = "whisper-rs-sys"
version = "0.15.0"
build = "build.rs"
links = "whisper"
include = [
    "whisper.cpp/bindings/javascript/package-tmpl.json",
    "whisper.cpp/bindings/CMakeLists.txt",
    "whisper.cpp/CMakeLists.txt",
    "whisper.cpp/cmake",
    "whisper.cpp/src/**",
    "whisper.cpp/include/whisper.h",
    "whisper.cpp/ggml/cmake",
    "whisper.cpp/ggml/CMakeLists.txt",
    "whisper.cpp/ggml/src/**",
    "whisper.cpp/ggml/include/*.h",
    "whisper.cpp/LICENSE",
    "src/*.rs",
    "build.rs",
    "wrapper.h",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust bindings for whisper.cpp (FFI bindings)"
documentation = "https://docs.rs/whisper-rs-sys"
readme = false
license = "Unlicense"
repository = "https://codeberg.org/tazz4843/whisper-rs"

[features]
# [voicekit patch] runtime-loaded ggml backends; see build.rs.
backend-dl = []
coreml = []
cuda = []
force-debug = []
hipblas = []
intel-sycl = []
metal = []
openblas = []
openmp = []
vulkan = []

[lib]
name = "whisper_rs_sys"
path = "src/lib.rs"

[build-dependencies.bindgen]
version = "0.72"

[build-dependencies.cfg-if]
version = "1"

[build-dependencies.cmake]
version = "0.1"

[build-dependencies.fs_extra]
version = "1.3"

[build-dependencies.semver]
version = "1.0"
