name: release

# Builds voicekit for every supported platform. On a `v*` tag, publishes a GitHub release with
# SHA256SUMS and one archive per platform (macOS has Metal + CoreML linked in),
# and on Linux / Windows a .tar.gz with the executable plus the ggml libraries it loads at runtime
# (one CPU module per instruction-set level, and a Vulkan module that only loads where a Vulkan
# loader exists). Then run `node scripts/release-manifest.mjs <tag>` to pin them in
# plugin/shared/release.ts.
on:
  push:
    tags: ["v*"]
    # Runs on main keep its caches warm: pull requests can only restore caches from their own
    # branch or the default branch.
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        default: all
        options: [all, linux, darwin-arm64, darwin-x64, linux-arm64, linux-x64, win32-x64]

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Tags and main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Vulkan build inputs. Linux: headers, loader (link stub for the Vulkan module) and glslc from
  # conda-forge, because ubuntu-22.04's headers (1.3.204) are too old for ggml-vulkan and it has
  # no glslc package; building on 22.04 keeps the glibc requirement at 2.35.
  VULKAN_CONDA_PACKAGES: "shaderc=2026.4 glslang=16.6.0 spirv-tools=2026.4 libvulkan-headers=1.4.341.0 libvulkan-loader=1.4.341.0 spirv-headers=1.4.363.0"
  # Windows: the LunarG SDK.
  VULKAN_SDK_VERSION: "1.4.341.1"

jobs:
  platforms:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      native: ${{ steps.select.outputs.native }}
      inputs: ${{ steps.inputs.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      # Every file the native builds and their checks read, by Git object ID: the same on every
      # platform and branch for the same content (unlike hashFiles, which sees CRLF on Windows).
      # Docs, plugin/client, plugin/assets and the plugin-only test scripts aren't inputs.
      - id: inputs
        run: |
          hash=$(git ls-tree -r HEAD -- server build licenses LICENSE plugin/licenses \
            plugin/MODEL_LICENSES.md plugin/server plugin/shared plugin/package.json \
            plugin/npm-shrinkwrap.json .github/workflows/release.yml \
            scripts/build-mlx-worker.py scripts/build-qwen-worker.py scripts/collect-licenses.py \
            scripts/fetch-build-input.py scripts/package-release.sh scripts/smoke-real-models.py \
            scripts/test-sve-dots.py scripts/verify-native-package.mjs | sha256sum | cut -c1-40)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # A platform that already built and passed every check from these exact inputs is skipped,
      # for pull requests anywhere and for main when the record is from main (so main's caches
      # stay filled). Tags and manual runs build every selected platform.
      - id: select
        env:
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUTS: ${{ steps.inputs.outputs.hash }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          platforms = json.load(open('build/platforms.json'))
          target = os.environ['PLATFORM']
          selected = [p for p in platforms if target == 'all' or p['key'] == target or target == 'linux' and p['key'].startswith('linux-')]
          if not selected:
              raise SystemExit('Unknown platform: ' + os.environ['PLATFORM'])
          event, ref = os.environ['EVENT'], os.environ['REF']
          reuse = event == 'pull_request' or (event == 'push' and ref == 'refs/heads/main')
          def passed(key):
              name = 'native-ok-' + key + '-' + os.environ['INPUTS']
              out = subprocess.run(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/caches?key=' + name],
                                   capture_output=True, text=True)
              if out.returncode:
                  print('cache lookup failed, building:', out.stderr.strip())
                  return False
              refs = [c['ref'] for c in json.loads(out.stdout).get('actions_caches', []) if c['key'] == name]
              return any(r == 'refs/heads/main' for r in refs) if event == 'push' else bool(refs)
          build = [p for p in selected if not (reuse and passed(p['key']))]
          for p in selected:
              print(p['key'], 'build' if p in build else 'already passed with these inputs, skipped')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              # An empty matrix is invalid even for a skipped job, so keep the full one then.
              print('matrix=' + json.dumps({'include': build or selected}), file=output)
              print('native=' + ('true' if build else 'false'), file=output)
          PY

  build:
    needs: platforms
    if: needs.platforms.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # Portable binaries: no -mcpu/-march=native. With vulkan-dl ggml builds every CPU variant
      # anyway and picks one at runtime; macOS builds target the baseline.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the file times below.
          fetch-depth: 0
      # Cargo decides whether path crates (voicekit and the vendored whisper-rs-sys) are up to
      # date from file times, and a checkout makes every file new. Set each file under server/
      # to the time of the last commit that changed it, so files that didn't change match the
      # cached build and whisper.cpp isn't rebuilt.
      - name: Restore file times from Git history
        shell: bash
        run: |
          git log --format='format:%x00%ct' --name-only -- server | python3 -c '
          import os, sys
          seen, when = set(), 0
          for line in sys.stdin.read().split("\n"):
              if line.startswith("\0"):
                  when = int(line[1:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.isfile(line):
                      os.utime(line, (when, when))
          print(len(seen), "paths dated from history")
          '
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC environment for nested shader builds
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Pin the MSVC linker instead of Git Bash link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (Get-Command link.exe).Source
          if ($linker -notmatch '\\VC\\Tools\\MSVC\\') { throw "Not an MSVC linker: $linker" }
          Add-Content $env:GITHUB_ENV "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker"
          Add-Content $env:GITHUB_ENV 'CMAKE_GENERATOR=Ninja'
          Add-Content $env:GITHUB_ENV 'CC=cl'
          Add-Content $env:GITHUB_ENV 'CXX=cl'
          ninja --version
      - name: Locked archive verifier dependencies
        run: npm ci --prefix plugin --ignore-scripts
      # A fixed toolchain: releases don't change compiler with each stable release, the Rust cache
      # isn't invalidated every six weeks, and Cargo's target layout is the one rust-cache knows
      # (newer Cargo's layout lost whisper-rs-sys's fingerprints in the cache, so it rebuilt).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # Keep the workspace members' builds too: whisper-rs-sys (whisper.cpp and its Vulkan
          # shaders) takes minutes to build. "ws" changes the key so such a cache gets saved.
          key: ${{ matrix.features }}-ws-${{ hashFiles('build/native-inputs.json') }}
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Discard incompatible Visual Studio CMake cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(Get-ChildItem server/target/release/build/whisper-rs-sys* -Directory -ErrorAction SilentlyContinue)
          $old = @($roots | Get-ChildItem -Recurse -Filter CMakeCache.txt | Select-String -SimpleMatch 'CMAKE_GENERATOR:INTERNAL=Visual Studio')
          if ($old.Count) {
            $roots | Remove-Item -Recurse -Force
            Get-ChildItem server/target/release/.fingerprint/whisper-rs-sys* -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          }
      - name: Verify native inference libraries before linking
        shell: bash
        run: |
          verified="$RUNNER_TEMP/verified-sherpa-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 scripts/fetch-build-input.py "sherpa-${{ matrix.key }}" "$verified"
          # A fresh path also invalidates Cargo's cached build-script output after we remove
          # its extracted libraries; otherwise an unchanged env value retains stale link paths.
          echo "SHERPA_ONNX_ARCHIVE_DIR=$verified" >> "$GITHUB_ENV"
          # Do not reuse an extraction made before the pinned-input check.
          rm -rf server/target/sherpa-onnx-prebuilt
      - name: Vulkan build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev ninja-build
          mkdir -p "$RUNNER_TEMP/mamba"
          archive=$(python3 scripts/fetch-build-input.py "micromamba-${{ matrix.key }}" "$RUNNER_TEMP/verified-tools")
          tar -xjf "$archive" -C "$RUNNER_TEMP/mamba" bin/micromamba
          "$RUNNER_TEMP/mamba/bin/micromamba" --no-rc create -y -r "$RUNNER_TEMP/mamba/root" -p "$RUNNER_TEMP/vulkan" --override-channels -c conda-forge $VULKAN_CONDA_PACKAGES
          "$RUNNER_TEMP/vulkan/bin/glslc" --version
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan/bin" >> "$GITHUB_PATH"
          # clang: GCC 11 rejects the -march values of ggml's armv9.2 CPU variants.
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = python scripts/fetch-build-input.py vulkan-sdk-win32-x64 "$env:RUNNER_TEMP\verified-tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\bin"
      - name: Test
        working-directory: server
        shell: bash
        run: cargo test --locked --release --features "${{ matrix.features }}"
      - name: Build
        working-directory: server
        shell: bash
        run: cargo build --locked --release --features "${{ matrix.features }}"
      - name: Nested CMake diagnostics (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem server/target/release/build -Recurse -Filter CMakeConfigureLog.yaml -ErrorAction SilentlyContinue |
            Where-Object FullName -Match 'vulkan-shaders-gen' |
            ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 120 }
      - name: Collect dependency notices and covered source
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          cargo metadata --locked --format-version 1 --filter-platform "$host" --features "${{ matrix.features }}" --manifest-path server/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          python3 scripts/collect-licenses.py "$RUNNER_TEMP/cargo-metadata.json" "$RUNNER_TEMP/voicekit-notices"
          echo "VOICEKIT_NOTICES=$RUNNER_TEMP/voicekit-notices" >> "$GITHUB_ENV"
      # Workers are rebuilt only when their inputs change: the key covers their sources, build
      # scripts, the Vulkan toolchain pins and the runner image. Other edits to this workflow
      # don't invalidate them. Release tags always build from source and never use or fill these
      # caches.
      - name: Runner image for worker cache keys
        id: runner-image
        shell: bash
        run: |
          # The OS, the C compiler's version line and the Vulkan pins, not the exact runner image:
          # images roll out gradually, so consecutive jobs can land on different ones.
          compiler=$("${CC:-cc}" --version 2>&1 | head -1)
          echo "compiler: $compiler"
          id=$(COMPILER="$compiler" python3 -c 'import hashlib, os; print(hashlib.sha256((os.environ["COMPILER"] + " " + os.environ["VULKAN_CONDA_PACKAGES"] + " " + os.environ["VULKAN_SDK_VERSION"]).encode()).hexdigest()[:16])')
          echo "version=${ImageOS:-unknown}-$id" >> "$GITHUB_OUTPUT"
          # A restore unpacks over what is there; start from empty folders.
          rm -rf server/target/release/gguf-runtime server/target/release/mlx-runtime
      - name: Restore Qwen GGUF worker
        id: qwen-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v4
        with:
          path: server/target/release/gguf-runtime
          key: qwen-worker-${{ matrix.key }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('server/vendor/qwen-sources/**', 'server/qwen-worker/**', 'scripts/build-qwen-worker.py', 'licenses/yyjson-MIT.txt') }}
      - name: Build isolated Qwen GGUF worker
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          flags=()
          if [[ "${{ runner.os }}" != "macOS" ]]; then flags+=(--vulkan); fi
          python3 scripts/build-qwen-worker.py --target-dir server/target/release "${flags[@]}"
      - name: Save Qwen GGUF worker
        if: ${{ steps.qwen-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: server/target/release/gguf-runtime
          key: qwen-worker-${{ matrix.key }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('server/vendor/qwen-sources/**', 'server/qwen-worker/**', 'scripts/build-qwen-worker.py', 'licenses/yyjson-MIT.txt') }}
      - name: Select Swift build tools
        if: matrix.key == 'darwin-arm64'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: MLX worker cache key
        id: mlx-key
        if: matrix.key == 'darwin-arm64'
        shell: bash
        # Git object IDs of the committed sources: unlike hashFiles, unaffected by the .build
        # folder the build creates before the save step computes the key again.
        run: |
          echo "xcode=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
          echo "src=$(git rev-parse HEAD:server/mlx-worker HEAD:scripts/build-mlx-worker.py | tr '\n' '-' | cut -c1-83)" >> "$GITHUB_OUTPUT"
      - name: Restore bundled native MLX worker
        id: mlx-cache
        if: ${{ matrix.key == 'darwin-arm64' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v4
        with:
          path: server/target/release/mlx-runtime
          key: mlx-worker-${{ steps.runner-image.outputs.version }}-${{ steps.mlx-key.outputs.xcode }}-${{ steps.mlx-key.outputs.src }}
      - name: Build bundled native MLX worker
        if: matrix.key == 'darwin-arm64' && steps.mlx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          xcodebuild -downloadComponent MetalToolchain
          python3 scripts/build-mlx-worker.py --target-dir server/target/release --timeout 1800
      - name: Save bundled native MLX worker
        if: ${{ matrix.key == 'darwin-arm64' && steps.mlx-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: server/target/release/mlx-runtime
          key: mlx-worker-${{ steps.runner-image.outputs.version }}-${{ steps.mlx-key.outputs.xcode }}-${{ steps.mlx-key.outputs.src }}
      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.key }}" == darwin-* ]]; then
            expected=arm64
            if [[ "${{ matrix.key }}" == darwin-x64 ]]; then expected=x86_64; fi
            test "$(lipo -archs server/target/release/voicekit)" = "$expected"
          fi
          asset=$(bash scripts/package-release.sh "${{ matrix.key }}" server/target/release dist)
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          ls -la dist
      - name: Unpack the asset like the plugin does
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          exe=voicekit
          if [ "${{ runner.os }}" = "Windows" ]; then exe=voicekit.exe; fi
          node scripts/verify-native-package.mjs "$ASSET" "$RUNNER_TEMP/smoke"
          echo "EXE=$RUNNER_TEMP/smoke/voicekit-${{ matrix.key }}/$exe" >> "$GITHUB_ENV"
      - name: No link-time Vulkan dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          readelf -d "$EXE" | grep -E 'NEEDED|RUNPATH'
          if readelf -d "$EXE" | grep -q libvulkan; then echo "voicekit links libvulkan" >&2; exit 1; fi
      - name: No missing Visual C++ runtime dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin was not found' }
          $root = "$env:RUNNER_TEMP\smoke\voicekit-win32-x64"
          $files = @(Get-Item "$root\voicekit.exe", "$root\gguf-runtime\voicekit-qwen-worker.exe") + @(Get-ChildItem $root -Recurse -Filter '*.dll')
          foreach ($file in $files) {
            $imports = & $dumpbin /dependents $file.FullName | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $($file.Name)" }
            if ($imports -match '(?im)^\s*(vcruntime\w*|msvcp\w*|vcomp\w*)\.dll\s*$') {
              throw "Unpackaged Visual C++ runtime required by $($file.Name)"
            }
          }
      - name: Smoke test (devices, HTTP surface with stub engines)
        shell: bash
        run: |
          "$EXE" --version
          "$EXE" devices
          VOICEKIT_TOKEN=ci "$EXE" serve --stub --port 48600 --models-dir "$RUNNER_TEMP/models" > "$RUNNER_TEMP/out.log" 2>&1 &
          for i in $(seq 1 30); do grep -q '"listening"' "$RUNNER_TEMP/out.log" && break; sleep 1; done
          curl -sf localhost:48600/health
          curl -sf -o "$RUNNER_TEMP/p.pcm" -H "Authorization: Bearer ci" -H "content-type: application/json" \
            -d '{"input":"hello","response_format":"pcm"}' localhost:48600/v1/audio/speech
          test "$(wc -c < "$RUNNER_TEMP/p.pcm")" -gt 1000
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:48600/v1/models)
          test "$code" = "401"
          kill %1 || true
      - name: Check ARM SVE dot-product tails
        if: matrix.key == 'linux-arm64'
        shell: bash
        run: python3 scripts/test-sve-dots.py "$(dirname "$EXE")" --require-sve
      # The smoke test's models are the same on every platform, so one cache serves all five. The
      # larger Qwen model (only Windows and Linux x64 test it) is cached on its own, from a
      # separate folder. Keyed by the catalog, which pins every file's checksum, using Git's
      # object ID: hashFiles would differ on Windows, which checks text out with CRLF.
      # Release tags download fresh.
      - name: Model cache key
        id: models-key
        shell: bash
        run: echo "catalog=$(git rev-parse HEAD:server/catalog.json)" >> "$GITHUB_OUTPUT"
      - name: Restore real-model downloads
        id: models-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@v4
        with:
          path: .ci-models
          key: real-models-${{ steps.models-key.outputs.catalog }}
          enableCrossOsArchive: true
      - name: Restore the larger Qwen model
        id: large-model-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && (matrix.key == 'win32-x64' || matrix.key == 'linux-x64') }}
        uses: actions/cache/restore@v4
        with:
          path: .ci-large-model
          key: real-models-large-${{ steps.models-key.outputs.catalog }}
          enableCrossOsArchive: true
      - name: Put the larger Qwen model in place
        if: steps.large-model-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p .ci-models
          mv .ci-large-model/Qwen3-TTS-1.7B-CustomVoice-GGUF-Q8 .ci-models/
      - name: Real model CPU inference and round trips
        id: real-models
        timeout-minutes: 12
        shell: bash
        run: |
          extra=()
          if [[ "${{ matrix.key }}" == win32-x64 || "${{ matrix.key }}" == linux-x64 ]]; then
            extra+=(--large-qwen)
          fi
          python3 scripts/smoke-real-models.py --exe "$EXE" \
            --models-dir "$GITHUB_WORKSPACE/.ci-models" --output "$RUNNER_TEMP/real-model-report" \
            --accelerator cpu --timeout 540 "${extra[@]}"
      - name: Diagnose Linux ARM CPU variant failures
        if: failure() && steps.real-models.outcome == 'failure' && matrix.key == 'linux-arm64'
        timeout-minutes: 12
        shell: bash
        run: |
          lscpu > "$RUNNER_TEMP/real-model-report/cpu.txt"
          mkdir -p "$RUNNER_TEMP/disabled-cpu-variants"
          # Compare the same archive and weights with the baseline Whisper CPU
          # kernel. The original failure still blocks publication; this is evidence only.
          root=$(dirname "$EXE")
          test -f "$root/libggml-cpu-armv8.0_1.so"
          for lib in "$root"/libggml-cpu-*.so; do
            if [[ "$(basename "$lib")" != libggml-cpu-armv8.0_1.so ]]; then
              mv "$lib" "$RUNNER_TEMP/disabled-cpu-variants/"
            fi
          done
          python3 scripts/smoke-real-models.py --exe "$EXE" \
            --models-dir "$GITHUB_WORKSPACE/.ci-models" \
            --output "$RUNNER_TEMP/real-model-report/baseline" \
            --accelerator cpu --timeout 540
      - name: Set the larger Qwen model aside for its own cache
        if: ${{ success() && steps.large-model-cache.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p .ci-large-model
          if [ -d .ci-models/Qwen3-TTS-1.7B-CustomVoice-GGUF-Q8 ]; then
            mv .ci-models/Qwen3-TTS-1.7B-CustomVoice-GGUF-Q8 .ci-large-model/
          fi
      - name: Save real-model downloads
        if: ${{ success() && steps.models-cache.outcome == 'success' && steps.models-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-models
          key: real-models-${{ steps.models-key.outputs.catalog }}
          enableCrossOsArchive: true
      - name: Save the larger Qwen model
        if: ${{ success() && steps.large-model-cache.outcome == 'success' && steps.large-model-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-large-model
          key: real-models-large-${{ steps.models-key.outputs.catalog }}
          enableCrossOsArchive: true
      - name: Preserve real model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-models-${{ matrix.key }}
          overwrite: true
          path: ${{ runner.temp }}/real-model-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && env.ASSET != ''
        with:
          name: voicekit-${{ matrix.key }}
          overwrite: true
          path: ${{ env.ASSET }}
      # Records that this platform built and passed every check from these exact inputs; the
      # platforms job skips it next time the inputs are the same. Tags don't record.
      - name: Record a passing build
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          mkdir -p .ci-native-ok
          echo "${{ github.run_id }} ${{ github.sha }}" > .ci-native-ok/run
      - name: Save the passing-build record
        if: ${{ success() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: .ci-native-ok
          key: native-ok-${{ matrix.key }}-${{ needs.platforms.outputs.inputs }}

  plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Typecheck plugin
        working-directory: plugin
        run: npm ci --ignore-scripts && npm run typecheck
      - name: Behavioral regressions and pinned-input checks
        run: |
          node scripts/run-behavior-tests.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and check npm artifact
        run: |
          node scripts/pack-plugin.mjs "$RUNNER_TEMP/npm-package"
          node scripts/verify-plugin-package.mjs "$RUNNER_TEMP/npm-package"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-check
          overwrite: true
          path: ${{ runner.temp }}/npm-package/*.tgz

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voicekit-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum voicekit-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
