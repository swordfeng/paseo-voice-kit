[package]
name = "voicekit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local OpenAI-compatible speech server (STT + TTS) for Paseo"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
bytes = "1"
sherpa-onnx = "2.0.1"
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "multipart", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
bzip2 = "0.5"
tar = "0.4"
whisper-rs-sys = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
whatlang = "0.16"
libc = "0.2"
wsola = { version = "=0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[features]
default = []
# Linux / Windows release builds: ggml backends are runtime-loaded modules next to the
# executable (the CPU variant that fits the running CPU; Vulkan when a loader and a GPU exist).
# The executable never links the Vulkan loader, so it starts without one. See
# vendor/whisper-rs-sys.
vulkan-dl = ["whisper-rs-sys/backend-dl", "whisper-rs-sys/vulkan"]
# Statically linked GPU backends (the binary then needs the Vulkan loader / CUDA runtime to start).
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
# Whisper encoder on the Apple Neural Engine (needs a <model>-encoder.mlmodelc next to the model).
coreml = ["whisper-rs/coreml"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# whisper-rs-sys with an added `backend-dl` build mode (ggml backend plugins); otherwise unchanged.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
